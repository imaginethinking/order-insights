spring.application.name=order-insights

spring.profiles.default=dev

# H2 database
spring.datasource.url=jdbc:h2:mem:orderinsights;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Create tables for entities on startup and drop on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
